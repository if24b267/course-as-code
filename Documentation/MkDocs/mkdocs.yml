site_name: Course as Code
site_url: https://davimalu.github.io/course-as-code/
repo_url: https://github.com/Davimalu/course-as-code
repo_name: davimalu/course-as-code
copyright: Created by Davimalu, lkalchhauser, david051202, if24b270 and xSulo for InnoLab 1-3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Davimalu/course-as-code/

theme:
  name: material
  language: en
  icon: material/simple-moodle
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top # Show back to top button
    - navigation.tabs
    - navigation.expand
    - navigation.indexes
    - navigation.path # Show the path to the current page using breadcrumbs
    - search.suggest # suggest search terms while typing
    - search.highlight # highlights search terms in the text
    - navigation.footer
    - toc.follow
    - content.code.copy # Enable code copy button
    - content.code.annotate # Enable code annotations
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: green
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables

plugins:
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
      theme: 
        light: catppuccin/latte-white
        dark: catppuccin/frappe
  - search:
  - document-dates:
      position: bottom

nav:
  - Home: index.md
  - Usage:
      - Overview: Usage/Overview.md
      - Moodle Environment Setup: Usage/Moodle_Environment_Setup.md
      - Course As Code Setup: Usage/Course_As_Code_Setup.md
      - Creating a Course: Usage/Creating_A_Course.md
      - Exporting a Course: Usage/Exporting_A_Course.md
      - Importing a Course: Usage/Importing_A_Course.md
  - Architecture:
      - Overview: Architecture/Overview.md
      - Readers: Architecture/Readers.md
      - Internal Data Model:
        - Architecture/DataModel/index.md
        - General Concepts: Architecture/DataModel/Nomenclature.md
        - Course-specific Concepts: Architecture/DataModel/Course_Nomenclature.md
        - User-specific Concepts: Architecture/DataModel/User_Nomenclature.md
      - Writer: Architecture/Writer.md
  - Activities:
      - Overview: Activities/Overview.md
      - Assignment: Activities/Assignment.md
      - Moodle File: Activities/Moodle_File.md
      - Text and Media Area: Activities/Text_and_Media_Area.md
      - URL: Activities/URL.md
      - Quiz:
        - Activities/Quiz/index.md
        - Question Types: Activities/Quiz/Question_Types.md
        - Quiz Architecture & Developer Guide: Activities/Quiz/Quiz_Architecture_and_Extensibility.md
  - Grading:
      - Overview: Grading/Overview.md
      - Grade Categories: Grading/Grade_Categories.md
      - Grade Items: Grading/Grade_Items.md
  - Moodle Backup File (.mbz):
      - General: MoodleBackupFile/General.md
      - Base Structure: MoodleBackupFile/Base_Structure.md
      - Activites:
        - Assignment: MoodleBackupFile/Activities/Assignment.md
        - Forum: MoodleBackupFile/Activities/Forum.md
        - Quiz: MoodleBackupFile/Activities/Quiz.md
      - QuestionTypes:
        - CodeRunner: MoodleBackupFile/QuestionTypes/CodeRunner.md
        - Dropdown: MoodleBackupFile/QuestionTypes/Dropdown.md
        - Matching: MoodleBackupFile/QuestionTypes/DragAndDropText.md
