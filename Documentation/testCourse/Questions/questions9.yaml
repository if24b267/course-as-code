Questions:
  - QuestionName: "Simple Calculation {A} + {B}"
    Category: simple_calcualted
    QuestionId: 18
    QuestionText: "<p>Calculate the sum of {A} and {B}.</p>"
    QuestionTextFormat: HTML
    DefaultMark: 1
    QuestionType: SIMPLECALCULATED
    QuestionReady: true

    # 1. Numerical Options
    NumericalOptions:
      ShowUnits: 3 # 3 = students have to write the answer into a text field
      UnitsLeft: false # false = Unit is on the right eg. "10 kg" 
      UnitGradingType: 0 # 0 = units disabled, 1 = enabeld
      UnitPenalty: 0.1

    # 2. Numerical Units (Optional)
    NumericalUnits:
      - UnitName: "cm"
        Multiplier: 1.0 # Base unit
      - UnitName: "m"
        Multiplier: 0.01 # If "m" is used, moodle calculates "1m / 0.01" and ends up getting the unit in cm, in order to check if the value is true

    # 3. Dataset Definitions
    DatasetDefinitions:
      - Name: "A" # Wildcard name
        Category: 0 # 0 = this variable is privat, eg. is only part of this question
        Type: 1 # Moodle generates the value by itself
        Options: "uniform:1.0:10.0:1" # "..:1.0" = min value, "10.0" = max value, "1" = Decimals
        Items:
          - Number: 1
            Value: 5.0
          - Number: 2
            Value: 3.5
      - Name: "B"
        Category: 0
        Type: 1
        Options: "uniform:1.0:10.0:1"
        Items:
          - Number: 1
            Value: 2.0
          - Number: 2
            Value: 6.1

    # 4. Calculated Records
    CalculatedRecords:
      - Tolerance: 0.01
        ToleranceType: 1       # 1 = Relative, 2 = Nominal, etc.
        CorrectAnswerLength: 1 # Amount of Decimals
        CorrectAnswerFormat: 1 # 1 = in Decimals

    # 5. Answers
    Answers:
      - AnswerText: "{A} + {B}"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 1.0
        Feedback: "Well done!"
        FeedbackFormat: HTML
