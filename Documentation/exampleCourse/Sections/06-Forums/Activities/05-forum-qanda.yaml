Type: FORUM
Name: "Question and Answer Forum"
Description: "<p>This is a <strong>Q&A Forum</strong>.</p><p>The teacher posts a question and students must post their own answer before they can see other students' responses. This ensures original thinking and prevents copying.</p>"

# Forum Type
ForumType: QAndA

# Introduction displayed at the top of the forum
Intro: "<p>Answer the question below!</p><p><strong>Important:</strong> You must submit your own answer before you can view responses from other students. This encourages independent thinking.</p>"
IntroFormat: 1

# Subscription and Tracking
SubscriptionMode: Optional
TrackingType: Forced

# Attachments
MaxAttachments: 2
MaxBytes: 2097152

# Completion Requirements
CompletionPosts: 1
CompletionReplies: 2

# Display Options
DisplayWordCount: false

# Assessment (optional - can be graded)
Assessed: false
GradeForum: false
