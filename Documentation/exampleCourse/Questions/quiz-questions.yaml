  - QuestionName: ConditionalLogic
    Category: Control Flow
    QuestionId: 22
    QuestionText: |
      Examine the following Java code:

      ```java
      public class Conditional {
          public static void main(String[] args) {
              int temperature = 25;
              String message;

              if (temperature > 30) {
                  message = "It's hot!";
              } else if (temperature < 20) {
                  message = "It's cold!";
              } else {
                  message = "It's pleasant.";
              }
              System.out.println(message);
          }
      }
      ```
      What will be printed to the console when this code is executed?
    QuestionTextFormat: MARKDOWN
    DefaultMark: 1
    QuestionType: SINGLECHOICE
    Answers:
      - AnswerText: "`It's hot!`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. The temperature is 25, which is not greater than 30.
      - AnswerText: "`It's cold!`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. The temperature is 25, which is not less than 20.
      - AnswerText: "`It's pleasant.`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 1
        Feedback: Correct! The temperature (25) falls into the `else` block because it's neither greater than 30 nor less than 20.
      - AnswerText: Nothing, there is a compilation error.
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. The code is syntactically correct and will compile and run.

  - QuestionName: JavaOOPConcepts
    Category: OOP
    QuestionId: 23
    QuestionText: <p>Match each Object-Oriented Programming (OOP) concept in Java to its description.</p>
    QuestionTextFormat: HTML
    DefaultMark: 4
    QuestionType: DROPDOWN
    SubQuestions:
      - SubQuestionText: <p>Encapsulation</p>
        SubQuestionTextFormat: HTML
        CorrectAnswer: <p>Bundling data (attributes) and methods (functions) that operate on the data within a single unit (class), and restricting direct access to some of the object's components.</p>
      - SubQuestionText: <p>Inheritance</p>
        SubQuestionTextFormat: HTML
        CorrectAnswer: <p>A mechanism where one class acquires the properties and behaviors of another class, promoting code reusability.</p>
      - SubQuestionText: <p>Polymorphism</p>
        SubQuestionTextFormat: HTML
        CorrectAnswer: <p>The ability of an object to take on many forms. In Java, this often refers to method overriding and method overloading.</p>
      - SubQuestionText: <p>Abstraction</p>
        SubQuestionTextFormat: HTML
        CorrectAnswer: <p>Hiding complex implementation details and showing only the essential features of an object.</p>

