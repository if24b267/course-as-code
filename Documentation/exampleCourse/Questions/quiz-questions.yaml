    DefaultMark: 1
    QuestionType: MULTIPLECHOICE
    SingleChoice: false
    Answers:
      - AnswerText: "`int myNumber = 50;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.3333333333333333
        Feedback: Correct. This is the standard way to declare and initialize an integer variable in Java.
      - AnswerText: "`Integer myNumber = 50;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.3333333333333333
        Feedback: Correct. This uses the `Integer` wrapper class, which can auto-unbox the primitive `int` value.
      - AnswerText: "`myNumber = 50; int myNumber;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: -1
        Feedback: Incorrect. Variables must be declared before they are used or assigned a value.
      - AnswerText: "`var myNumber = 50;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.3333333333333333
        Feedback: Correct. Since Java 10, `var` can be used for local variable type inference.

