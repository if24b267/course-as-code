  - QuestionName: JavaMainMethod
    Category: Basics
    QuestionId: 19
    QuestionText: |
      Consider the following Java code snippet:

      ```java
      public class HelloWorld {
          public static void main(String[] args) {
              System.out.println("Hello, Java!");
          }
      }
      ```

      What is the significance of the `public static void main(String[] args)` method signature in a Java application?
    QuestionTextFormat: MARKDOWN
    DefaultMark: 1
    QuestionType: SINGLECHOICE
    Answers:
      - AnswerText: It's a constructor for the `HelloWorld` class.
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. Constructors have the same name as the class and no return type.
      - AnswerText: It is the entry point for the JVM to start program execution.
        AnswerTextFormat: MARKDOWN
