    QuestionText: |
      Given the following Java code:

      ```java
      public class VariableExample {
          public static void main(String[] args) {
              // Line X
              System.out.println(myNumber);
          }
      }
      ```

      Which of the following lines could replace `// Line X` to correctly declare an integer variable `myNumber` and initialize it with the value `50`? Select all that apply.
