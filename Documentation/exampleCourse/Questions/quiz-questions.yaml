        TextFormat: HTML

  - QuestionName: StandardIOInclude
    Category: Basics
    QuestionId: 10
    QuestionText: |
      Consider the following C code snippet:

      ```c
      #include <stdio.h>

      int main() {
          printf("Hello, C!");
          return 0;
      }
      ```

      What is the primary purpose of the line `#include <stdio.h>`?
    QuestionTextFormat: MARKDOWN
    DefaultMark: 1
    QuestionType: SINGLECHOICE
    Answers:
      - AnswerText: It defines the `main` function.
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. The `main` function is defined directly, not included.
      - AnswerText: It links the program to external files.
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. While it involves external files, its primary purpose is more specific to standard libraries.
      - AnswerText: It provides access to standard input/output functions like `printf`.
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 1
        Feedback: Correct! `stdio.h` stands for "standard input/output header" and is essential for functions like `printf` and `scanf`.
      - AnswerText: It declares all variables used in the program.
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. Variables are declared within the program's scope, not by `#include`.

  - QuestionName: ValidCVariableNames
    Category: Variables
    QuestionId: 11
    QuestionText: |
      Which of the following are **valid** variable names in C programming? Select all that apply.
    QuestionTextFormat: MARKDOWN
    DefaultMark: 1
    QuestionType: MULTIPLECHOICE
    SingleChoice: false
    Answers:
      - AnswerText: "`_my_variable`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.5
        Feedback: Correct. Variable names can start with an underscore.
      - AnswerText: "`1stVariable`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: -0.3333333333333333
        Feedback: Incorrect. Variable names cannot start with a digit.
      - AnswerText: "`variableName123`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.5
        Feedback: Correct. Variable names can contain letters, numbers, and underscores, but must start with a letter or underscore.
      - AnswerText: "`my-variable`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: -0.3333333333333333
        Feedback: Incorrect. Hyphens are not allowed in C variable names.
      - AnswerText: "`if`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: -0.3333333333333333
        Feedback: Incorrect. `if` is a reserved keyword in C.

  - QuestionName: OutputOfArithmetic
    Category: Operators
    QuestionId: 12
    QuestionText: |
      What will be the output of the following C code snippet?

      ```c
      #include <stdio.h>

      int main() {
          int x = 10;
          int y = 3;
          int result = x / y;
          printf("%d\n", result);
          return 0;
      }
      ```
    QuestionTextFormat: MARKDOWN
    DefaultMark: 1
    QuestionType: SINGLECHOICE
    Answers:
      - AnswerText: "`3.333333`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. Integer division truncates the decimal part.
      - AnswerText: "`3`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 1
        Feedback: Correct! When dividing two integers in C, the result is an integer, and any fractional part is truncated.
      - AnswerText: "`4`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. The result is 3, not rounded up.
      - AnswerText: "`10`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. This is not the result of the division.

  - QuestionName: InitializingVariables
    Category: Variables
    QuestionId: 13
    QuestionText: |
      Which of the following C code snippets correctly declare an integer variable `count` and initialize it with the value `0`? Select all that apply.
    QuestionTextFormat: MARKDOWN
    DefaultMark: 1
    QuestionType: MULTIPLECHOICE
    SingleChoice: false
    Answers:
      - AnswerText: "`int count = 0;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.5
        Feedback: Correct. This is a common and correct way to declare and initialize a variable.
      - AnswerText: "`int count; count = 0;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.5
        Feedback: Correct. This declares the variable first, then assigns the value. Both are valid.
      - AnswerText: "`integer count = 0;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: -0.25
        Feedback: Incorrect. The keyword for integer type in C is `int`, not `integer`.
      - AnswerText: "`count = 0; int count;`"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: -0.25
        Feedback: Incorrect. Variables must be declared before they are used or assigned a value.

