  - QuestionName: dragAndDropStructure
    Category: dragdrop
    QuestionId: 9
    QuestionText: "<p>In a <strong>DragAndDropTextQuestion</strong>, the main <code>QuestionText</code> contains placeholders like <code>[[1]]</code>, <code>[[2]]</code>, etc. Each number in a placeholder corresponds to the <code>[[ID_PROPERTY]]</code> of a <code>TextChoice</code> element. The actual text to be dragged into the gap is specified in the <code>[[VALUE_PROPERTY]]</code> of the respective <code>TextChoice</code>. To organize distractors for different gaps, <code>TextChoice</code> elements can be assigned a <code>[[CATEGORY_PROPERTY]]</code>. If a <code>TextChoice</code> element's ID is not referenced in any placeholder, it serves as a <code>[[UNUSED_CHOICE_ROLE]]</code>.</p>"
    QuestionTextFormat: HTML
