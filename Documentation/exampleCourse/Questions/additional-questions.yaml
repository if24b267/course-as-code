Questions:
  - QuestionName: Binary Conversion
    Category: shortanswer
    QuestionId: 101
    QuestionText: "<p>Convert the decimal number <strong>10</strong> into binary.</p>\n<p>Provide just the digits.</p>"
    QuestionTextFormat: HTML
    DefaultMark: 1
    QuestionType: SHORTANSWER
    UseCase: true
    Hints:
      - HintText: "Remember the powers of 2: 8, 4, 2, 1."
        HintTextFormat: MARKDOWN
    Answers:
      - AnswerText: "1010"
        AnswerTextFormat: PLAINTEXT
        AnswerGrade: 1
        Feedback: Correct! 8 + 2 = 10.
      - AnswerText: "00001010"
        AnswerTextFormat: PLAINTEXT
        AnswerGrade: 1
        Feedback: Correct! (Includes padding).
      - AnswerText: "10"
        AnswerTextFormat: PLAINTEXT
        AnswerGrade: 0
        Feedback: Incorrect. That is the decimal representation.

  - QuestionName: Big O Notation
    Category: shortanswer
    QuestionId: 102
    QuestionText: "What is the worst-case time complexity of the bubble sort algorithm?"
    QuestionTextFormat: MARKDOWN
    DefaultMark: 2
    QuestionType: SHORTANSWER
    UseCase: true
    Hints:
      - HintText: It involves nested loops.
        HintTextFormat: PLAINTEXT
    Answers:
      - AnswerText: "O(n^2)"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 1
        Feedback: Correct.
      - AnswerText: "n^2"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0.5
        Feedback: Technically correct math, but missing the Big O notation.
      - AnswerText: "O(n)"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 0
        Feedback: Incorrect. O(n) is linear time, usually associated with looping once.

  - QuestionName: HTTP Protocol
    Category: shortanswer
    QuestionId: 103
    QuestionText: "<p>Which HTTP method is typically used to <strong>retrieve</strong> data from a server?</p>"
    QuestionTextFormat: HTML
    DefaultMark: 1
    QuestionType: SHORTANSWER
    UseCase: true
    Hints:
      - HintText: Contrast this with POST, which is used to send data.
        HintTextFormat: MARKDOWN
    Answers:
      - AnswerText: "GET"
        AnswerTextFormat: PLAINTEXT
        AnswerGrade: 1
        Feedback: Spot on.
      - AnswerText: "get"
        AnswerTextFormat: PLAINTEXT
        AnswerGrade: 1
        Feedback: Correct (case insensitive).
      - AnswerText: "FETCH"
        AnswerTextFormat: PLAINTEXT
        AnswerGrade: 0.5
        Feedback: Fetch is the API used in JavaScript, but the underlying HTTP method is GET.

  - QuestionName: Analysis of Merge Sort
    Category: algorithms
    QuestionId: 104
    QuestionText: <p>Explain the time complexity of the Merge Sort algorithm. Specifically, describe the "divide" and "merge" steps and how they contribute to the final <strong>O(n log n)</strong> complexity.</p>
    QuestionTextFormat: HTML
    DefaultMark: 5
    QuestionType: ESSAY
    ResponseFormat: editor
    ResponseRequired: true
    ResponseFieldLines: 15
    # Word Limits
    MinWordLimit: 50
    MaxWordLimit: 400
    # Attachments
    AttachmentsAllowed: 0
    AttachmentsRequired: 0
    FileTypesList: ""
    MaxBytes: 0
    # Grader Info
    GraderInfo: "Award points for mentioning: 1. Recursive splitting of the list creates a tree with log(n) height. 2. The merging process requires iterating through n elements at each level. 3. Total work is height * work-per-level."
    GraderInfoFormat: MARKDOWN
    # Response Template
    ResponseTemplate: "Merge Sort achieves a time complexity of O(n log n) because..."
    ResponseTemplateFormat: MARKDOWN

  - QuestionName: "Network Transfer Time: {SIZE}MB @ {SPEED}Mbps"
    Category: cs_networking
    QuestionId: 105
    QuestionText: "<p>Calculate the time in <strong>seconds</strong> required to download a file of size <strong>{SIZE} MB</strong> (Megabytes) over a connection with a bandwidth of <strong>{SPEED} Mbps</strong> (Megabits per second).</p><p><em>Note: 1 Byte = 8 bits.</em></p>"
    QuestionTextFormat: HTML
    DefaultMark: 1
    QuestionType: SIMPLECALCULATED
    QuestionReady: true
    # 1. Numerical Options
    NumericalOptions:
      ShowUnits: 3
      UnitsLeft: false
      UnitGradingType: 1 # Enabled grading for units
      UnitPenalty: 0.1
    # 2. Numerical Units
    NumericalUnits:
      - UnitName: "s"
        Multiplier: 1.0
      - UnitName: "seconds"
        Multiplier: 1.0
    # 3. Dataset Definitions
    DatasetDefinitions:
      - Name: "SIZE"
        Category: 0
        Type: 1
        Options: "uniform:100.0:5000.0:0" # 100MB to 5000MB, 0 decimal places
        Items:
          - Number: 1
            Value: 500.0
          - Number: 2
            Value: 1024.0
      - Name: "SPEED"
        Category: 0
        Type: 1
        Options: "uniform:10.0:1000.0:0" # 10Mbps to 1000Mbps
        Items:
          - Number: 1
            Value: 50.0
          - Number: 2
            Value: 100.0
    # 4. Calculated Records
    CalculatedRecords:
      - Tolerance: 0.05
        ToleranceType: 1 # Relative tolerance (±5%)
        CorrectAnswerLength: 2
        CorrectAnswerFormat: 1
    # 5. Answers
    # Formula: (Size * 8) / Speed
    Answers:
      - AnswerText: "({SIZE} * 8) / {SPEED}"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 1.0
        Feedback: "Correct! Remember to convert Bytes to bits first."
        FeedbackFormat: HTML

  - QuestionName: "Bitmap Size Calculation {WIDTH}x{HEIGHT}"
    Category: cs_multimedia
    QuestionId: 106
    QuestionText: "<p>An uncompressed RGB image has a resolution of <strong>{WIDTH}</strong> by <strong>{HEIGHT}</strong> pixels and a color depth of <strong>24 bits</strong>.</p><p>Calculate the file size in <strong>Kilobytes (KB)</strong>.</p><p><em>(Use 1 KB = 1024 Bytes)</em></p>"
    QuestionTextFormat: HTML
    DefaultMark: 1
    QuestionType: SIMPLECALCULATED
    QuestionReady: true
    # 1. Numerical Options
    NumericalOptions:
      ShowUnits: 3
      UnitsLeft: false
      UnitGradingType: 1
      UnitPenalty: 0.1
    # 2. Numerical Units
    NumericalUnits:
      - UnitName: "KB"
        Multiplier: 1.0 
      - UnitName: "MB"
        Multiplier: 0.0009765625 # 1/1024
    # 3. Dataset Definitions
    DatasetDefinitions:
      - Name: "WIDTH"
        Category: 0
        Type: 1
        Options: "uniform:800.0:1920.0:0"
        Items:
          - Number: 1
            Value: 1920.0
          - Number: 2
            Value: 800.0
      - Name: "HEIGHT"
        Category: 0
        Type: 1
        Options: "uniform:600.0:1080.0:0"
        Items:
          - Number: 1
            Value: 1080.0
          - Number: 2
            Value: 600.0
    # 4. Calculated Records
    CalculatedRecords:
      - Tolerance: 0.02
        ToleranceType: 1
        CorrectAnswerLength: 1
        CorrectAnswerFormat: 1
    # 5. Answers
    # Formula: ((Width * Height * 24) / 8) / 1024  -> Simplified: (W*H*3)/1024
    Answers:
      - AnswerText: "({WIDTH} * {HEIGHT} * 3) / 1024"
        AnswerTextFormat: MARKDOWN
        AnswerGrade: 1.0
        Feedback: "Good job calculating the memory footprint."
        FeedbackFormat: HTML

