name: Publish CourseAsCode for Linux-x64

on:
  push:

jobs:
  build-and-publish-linux-x64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate version identifier
      id: git_artifact_version
      run: echo "GIT_ARTIFACT_VERSION=$(date +'%Y%m%d%H%M%S')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Publish project
      run: dotnet publish -c Release -r linux-x64 --self-contained false -o course_as_code_linux_x64 -nowarn

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: course_as_code_linux-x64-${{ env.GIT_ARTIFACT_VERSION }}
        path: course_as_code_linux_x64