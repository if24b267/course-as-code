name: Publish & Test CourseAsCode

on:
  push:

jobs:
  test:
    name: Run NUnit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup and Generate Version
      uses: ./.github/actions/setup

    - name: Run Writer NUnit tests
      run: dotnet test CourseAsCode.Writers.Tests --logger "trx;LogFileName=writer-test_results.trx"
      
    - name: Run Reader NUnit tests
      run: dotnet test CourseAsCode.Readers.Tests --logger "trx;LogFileName=reader-test_results.trx"

    - name: Publish Test Results
      uses: dorny/test-reporter@v2
      if: always() # Always run this step, even if tests fail
      with:
        name: NUnit Test Results
        path: "**/*test_results.trx"
        reporter: dotnet-trx
        fail-on-error: true

    - name: Upload NUnit test results
      uses: actions/upload-artifact@v4
      with:
        name: writer-test-results-${{ env.GIT_ARTIFACT_VERSION }}
        path: "**/*test_results.trx"

  publish:
    name: Publish for Linux & Windows x64
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup and Generate Version
      uses: ./.github/actions/setup

    - name: Publish linux-x64 not self-contained project
      run: dotnet publish -c Release -r linux-x64 --self-contained false -o course_as_code_linux_x64

    # - name: Publish linux-x64 self-contained project
    #   run: dotnet publish -c Release -r linux-x64 --self-contained true -o course_as_code_linux_x64_self_contained

    - name: Publish win-x64 not self-contained project
      run: dotnet publish -c Release -r win-x64 --self-contained false -o course_as_code_win_x64

    # - name: Publish win-x64 self-contained project
    #   run: dotnet publish -c Release -r win-x64 --self-contained true -o course_as_code_win_x64_self_contained   

    - name: Upload linux-x64 not self contained artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-linux-x64
        path: course_as_code_linux_x64

    # - name: Upload linux-x64 self-contained artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: course_as_code_linux-x64-self-contained-${{ env.GIT_ARTIFACT_VERSION }}
    #     path: course_as_code_linux_x64_self_contained

    - name: Upload win-x64 not self contained artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-win-x64
        path: course_as_code_win_x64
    
    # - name: Upload win-x64 self-contained artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: course_as_code_win-x64-self-contained-${{ env.GIT_ARTIFACT_VERSION }}
    #     path: course_as_code_win_x64_self_contained

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    # Only run this job for tagged releases and on the main and develop branches to avoid creating releases on every push / feature branch
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop'
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts for Release
        run: |
          mkdir release_assets
          # Zip Linux
          cd artifacts/binary-linux-x64
          zip -r ../../release_assets/CourseAsCode-Linux-x64.zip .
          cd ../..
          # Zip Windows
          cd artifacts/binary-win-x64
          zip -r ../../release_assets/CourseAsCode-Win-x64.zip .
          cd ../..

      # Helper step to determine how to tag the release based on the trigger
      - name: Configure Release Tags
        id: config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag_name=latest-dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "title=Development Build (latest-dev)" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "tag_name=latest-main" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "title=Main Build (latest-main)" >> $GITHUB_OUTPUT
          else
            # If triggered by a real tag (e.g. v1.0.0), use that
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "title=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.config.outputs.title }}
          tag_name: ${{ steps.config.outputs.tag_name }}
          prerelease: ${{ steps.config.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release_assets/CourseAsCode-Linux-x64.zip
            release_assets/CourseAsCode-Win-x64.zip