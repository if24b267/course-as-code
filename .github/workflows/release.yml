name: Create GitHub Release

on:
  push:


permissions:
  contents: write

jobs:
  release_deployment:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts for Release
        run: |
          mkdir release_assets

          # Zip Linux
          cd artifacts/binary-linux-x64
          zip -r ../../release_assets/CourseAsCode-Linux-x64.zip .
          cd ../..

          # Zip Windows
          cd artifacts/binary-win-x64
          zip -r ../../release_assets/CourseAsCode-Win-x64.zip .
          cd ../..

      # Determine how to tag the release based on the trigger
      - name: Configure Release Tags
        id: config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag_name=latest-dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "title=Development Build (latest-dev)" >> $GITHUB_OUTPUT
          else [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "tag_name=latest-main" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "title=Main Build (latest-main)" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.config.outputs.title }}
          tag_name: ${{ steps.config.outputs.tag_name }}
          prerelease: ${{ steps.config.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release_assets/CourseAsCode-Linux-x64.zip
            release_assets/CourseAsCode-Win-x64.zip