name: Publish CourseAsCode

on:
  push:
    - master
    - develop

permissions:
  contents: write

jobs:
  publish:
    name: Publish for Linux & Windows x64
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup and Generate Version
      uses: ./.github/actions/setup

    - name: Publish linux-x64 not self-contained project
      run: dotnet publish -c Release -r linux-x64 --self-contained false -o course_as_code_linux_x64

    # - name: Publish linux-x64 self-contained project
    #   run: dotnet publish -c Release -r linux-x64 --self-contained true -o course_as_code_linux_x64_self_contained

    - name: Publish win-x64 not self-contained project
      run: dotnet publish -c Release -r win-x64 --self-contained false -o course_as_code_win_x64

    # - name: Publish win-x64 self-contained project
    #   run: dotnet publish -c Release -r win-x64 --self-contained true -o course_as_code_win_x64_self_contained   

    - name: Upload linux-x64 not self contained artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-linux-x64
        path: course_as_code_linux_x64

    # - name: Upload linux-x64 self-contained artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: course_as_code_linux-x64-self-contained-${{ env.GIT_ARTIFACT_VERSION }}
    #     path: course_as_code_linux_x64_self_contained

    - name: Upload win-x64 not self contained artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-win-x64
        path: course_as_code_win_x64
    
    # - name: Upload win-x64 self-contained artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: course_as_code_win-x64-self-contained-${{ env.GIT_ARTIFACT_VERSION }}
    #     path: course_as_code_win_x64_self_contained

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch previous tags for calculation

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts for Release
        run: |
          mkdir release_assets
          # Zip Linux
          cd artifacts/binary-linux-x64
          zip -r ../../release_assets/CourseAsCode-Linux-x64.zip .
          cd ../..
          # Zip Windows
          cd artifacts/binary-win-x64
          zip -r ../../release_assets/CourseAsCode-Win-x64.zip .
          cd ../..

      # Calculate Next Version based on Branch
      - name: Calculate Next Semantic Version
        id: version_calc
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Fetch all tags to find the latest
          git fetch --tags --force
          
          # Find latest tag matching v*, sort naturally, take the last one
          # If no tag exists, default to v0.0.0
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found. Initializing base."
            LATEST_TAG="v0.0.0"
          fi
          
          echo "Previous version: $LATEST_TAG"
          echo "Commit Message: $COMMIT_MSG"
          
          # Remove 'v' prefix for math
          VERSION=${LATEST_TAG#v}
          
          # Split into Major.Minor.Patch
          IFS='.' read -r -a parts <<< "$VERSION"
          major=${parts[0]}
          minor=${parts[1]}
          patch=${parts[2]}
          
          # Branch Logic
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "Branch is Master. Incrementing MAJOR."
            major=$((major + 1))
            minor=0
            patch=0
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
             # Check if commit message starts with "hotfix" (case insensitive)
             if [[ "$COMMIT_MSG" =~ ^[Hh]otfix ]]; then
                echo "Hotfix detected on Develop. Incrementing PATCH."
                patch=$((patch + 1))
             else
                echo "Standard Develop push. Incrementing MINOR."
                minor=$((minor + 1))
                patch=0
             fi
          else
             echo "Unrecognized branch fallthrough. Incrementing PATCH."
             patch=$((patch + 1))
          fi
          
          NEW_TAG="v$major.$minor.$patch"
          echo "New Version: $NEW_TAG"
          
          # Set Output for the next step
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version_calc.outputs.new_tag }}
          tag_name: ${{ steps.version_calc.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/CourseAsCode-Linux-x64.zip
            release_assets/CourseAsCode-Win-x64.zip